[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-queue"
version = "0.2.0"
description = "Mini-Slurm for a single shared GPU machine: gq submit / gq ls / gq logs -f"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nvidia-ml-py",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gq = "gpu_queue.cli:main"
gqd = "gpu_queue.daemon:main"

[tool.setuptools]
packages = ["gpu_queue"]
